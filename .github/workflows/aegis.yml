# Runs the Aegis security scanners on main and uploads results for /aegis audit.
# Setup and what it checks: https://github.com/Nextrium/aegis-scan#readme
name: Aegis scan
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
jobs:
  aegis:
    permissions:
      contents: read
      id-token: write
    uses: Nextrium/aegis-scan/.github/workflows/aegis-scan.yml@8774c7b7f4e17dc7c91434b6b3976e708165ef59
