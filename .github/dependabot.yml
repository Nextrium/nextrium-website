# Dependabot only opens PRs; nothing merges them automatically (repo auto-merge is off).
version: 2
updates:
  - package-ecosystem: npm
    # The repo is an npm-workspaces monorepo: update from the root so each PR
    # changes the workspace's package.json and the root package-lock.json together.
    # (Pointing at /apps/website alone leaves the lockfile behind and every build fails.)
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # Major jumps of the toolchain wait for a deliberate decision, not a weekly PR.
      # @types/node follows the Node version we run (22), so it moves only with Node.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # One PR for routine minor and patch updates instead of one per package.
      minor-and-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"
